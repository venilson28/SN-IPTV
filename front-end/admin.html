<!DOCTYPE html>

<body>
    
<h1>Clientes</h1>

<table border="1">
  <thead>
    <tr>
      <th>Nome</th>
      <th>Email</th>
      <th>Status</th>
      <th>Ação</th>
    </tr>
  </thead>
  <tbody id="tabela"></tbody>
</table>

<script>
async function carregar() {
  const res = await fetch("http://localhost:3000/admin/clientes");
  const data = await res.json();

  const tabela = document.getElementById("tabela");

  tabela.innerHTML = data.map(c => `
    <tr>
      <td>${c.nome}</td>
      <td>${c.email}</td>
      <td>${c.status}</td>
      <td>
        <button onclick="marcarPago(${c.id})">
          Marcar Pago
        </button>
      </td>
    </tr>
  `).join("");
}

async function marcarPago(id) {
  const res = await fetch(`http://localhost:3000/pagar/${id}`, {

  }*/
}

carregar();
</script>
</body>
